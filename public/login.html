<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Entrar — O Mister</title>
  <meta name="theme-color" content="#FAF9F6">
  <link rel="icon" type="image/x-icon" href="icons/favicon.ico">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
  <script src="config.js"></script>
</head>
<body>

<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">
      <img src="img/login-logo.png" alt="MIOG — Mister Intelligence O&G">
    </div>
    <h1 class="auth-title">Entrar</h1>

    <button id="google-btn" class="auth-google">
      <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true">
        <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
        <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
        <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
        <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
      </svg>
      Continuar com o Google
    </button>

    <div class="auth-divider"><span>ou</span></div>

    <form id="email-form" class="auth-form">
      <input id="email-input" type="email" required placeholder="voce@email.com" autocomplete="email">
      <button type="submit" id="email-btn" class="auth-submit">Enviar link de acesso</button>
    </form>

    <p id="auth-msg" class="auth-msg" hidden></p>
    <p id="auth-config-warn" class="auth-warn" hidden>
      Login indisponível: preencha o <code>config.js</code> com os dados do seu projeto Supabase.
    </p>
  </div>

  <p class="auth-foot">O Mister pode cometer erros. Confira sempre a norma original.</p>
</div>

<script src="auth.js"></script>
<script src="login.js"></script>
</body>
</html>
